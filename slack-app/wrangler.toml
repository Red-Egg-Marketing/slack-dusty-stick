name = "dusty-stick"
main = "src/index.js"
compatibility_date = "2024-11-01"


# Static assets — serves ./public at the Worker's own hostname.
[assets]
directory = "./public"

# ---------------------------------------------------------------------------
# /notacos config — the No-Taco Club (inverse HeyTaco leaderboard).
#
# HEYTACO_DAYS is the leaderboard window in days (default 30 if unset). The
# HeyTaco team id is a credential and is set as a SECRET, not here:
#   npx wrangler secret put HEYTACO_TEAM_ID
# (Find the team id signed into HeyTaco. Also requires the bot's users:read
# scope, which the app already has, for the workspace roster.)
# ---------------------------------------------------------------------------
[vars]
HEYTACO_DAYS = "30"

# ---------------------------------------------------------------------------
# Cloudflare D1 binding.
# Create the database once with:  npx wrangler d1 create dusty-stick
# Then paste the returned "database_id" value below (replace the placeholder).
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "dusty-stick"
database_id = "c2f4e19e-e569-4298-9272-1992b3d2f883"

# ---------------------------------------------------------------------------
# Secrets (do NOT put these here — set them with `wrangler secret put`):
#   npx wrangler secret put SLACK_SIGNING_SECRET
#   npx wrangler secret put SLACK_BOT_TOKEN
#
# SLACK_SIGNING_SECRET — from your Slack app's "Basic Information" page.
# SLACK_BOT_TOKEN      — the "Bot User OAuth Token" (starts with xoxb-),
#                        used to call views.publish for the App Home tab.
# ---------------------------------------------------------------------------

name = "dusty-stick"
main = "src/index.js"
compatibility_date = "2024-11-01"


# Static assets — serves ./public at the Worker's own hostname.
[assets]
directory = "./public"

# ---------------------------------------------------------------------------
# /highscores config — the Red Egg arcade high-score board.
#
# GAME_API_BASE is the base URL of the WordPress site running the Red Egg Game
# plugin. The Worker fetches <base>/wp-json/red-egg-game/v1/leaderboard from it.
# Set it to wherever the game plugin actually lives (prod or staging).
# ---------------------------------------------------------------------------
[vars]
GAME_API_BASE = "https://redeggmark1dev.wpenginepowered.com"

# Optional shared secret for the leaderboard endpoint. If you define a matching
# token in the plugin (RED_EGG_GAME_API_TOKEN), set the SAME value here as a
# secret so the Worker sends it in the X-Red-Egg-Token header:
#   npx wrangler secret put GAME_API_TOKEN
# Leave both unset to keep the endpoint open (it only ever exposes name+score).

# ---------------------------------------------------------------------------
# Cloudflare D1 binding.
# Create the database once with:  npx wrangler d1 create dusty-stick
# Then paste the returned "database_id" value below (replace the placeholder).
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "dusty-stick"
database_id = "c2f4e19e-e569-4298-9272-1992b3d2f883"

# ---------------------------------------------------------------------------
# Secrets (do NOT put these here — set them with `wrangler secret put`):
#   npx wrangler secret put SLACK_SIGNING_SECRET
#   npx wrangler secret put SLACK_BOT_TOKEN
#
# SLACK_SIGNING_SECRET — from your Slack app's "Basic Information" page.
# SLACK_BOT_TOKEN      — the "Bot User OAuth Token" (starts with xoxb-),
#                        used to call views.publish for the App Home tab.
# ---------------------------------------------------------------------------
